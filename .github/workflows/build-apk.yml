name: Build beacon APK
on:
  push:
    paths: ["launcher/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-30" >/dev/null
      - name: Build
        run: BUILD_TOOLS=34.0.0 VERSION_CODE=$((100 + ${{ github.run_number }})) bash launcher/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: BeaconHome, path: launcher/build/BeaconHome.apk }
      - name: Publish as the "latest" release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # Clear out any earlier "latest" release and its tag (each step may fail harmlessly if there is nothing there).
          gh release delete latest -y --cleanup-tag || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" || true
          sleep 3
          NOTES="Built automatically from commit ${GITHUB_SHA::7}. Install with windows/install-beacon.bat."
          if ! gh release create latest launcher/build/BeaconHome.apk --target "$GITHUB_SHA" -t "beacon (latest build)" -n "$NOTES"; then
            # The old release could not be removed: update it in place instead.
            gh release upload latest launcher/build/BeaconHome.apk --clobber
            gh release edit latest -t "beacon (latest build)" -n "$NOTES"
          fi
