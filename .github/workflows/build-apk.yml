name: Build beacon APK
on:
  push:
    paths: ["launcher/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-30" >/dev/null
      - name: Build
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: BUILD_TOOLS=34.0.0 VERSION_CODE=$((100 + ${{ github.run_number }})) VERSION_NAME=3.3.${{ github.run_number }} bash launcher/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: BeaconHome, path: launcher/build/BeaconHome.apk }
      - name: Publish a numbered release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="v3.3.${{ github.run_number }}"
          NOTES="Built automatically from commit ${GITHUB_SHA::7}. Install with windows/install-beacon.bat. versionCode: $((100 + ${{ github.run_number }}))"
          gh release create "$TAG" launcher/build/BeaconHome.apk --target "$GITHUB_SHA" -t "beacon $TAG" -n "$NOTES" --latest
          # Keep the newest 10 releases; older ones (and their tags) are removed so the page stays tidy.
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r t; do
            gh release delete "$t" -y --cleanup-tag || true
          done
